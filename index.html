<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A1931">
    <meta name="description" content="Assistente de agendamento e transcrição de reuniões por voz com IA.">
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Agendei">
    <meta name="application-name" content="Agendei">
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <title>Agendei | Executive</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --exec-navy: #0A1931;
            --exec-sapphire: #0F52BA;
            --exec-gold: #FFD700;
            --bg-light: #0A1931;
            --glass-bg: rgba(17, 34, 64, 0.75);
            --glass-border: rgba(255, 215, 0, 0.2);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-light);
            color: #FFFFFF;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        #root {
            height: 100%;
        }
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(255, 215, 0, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(15, 82, 186, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(17, 34, 64, 0.8) 0%, transparent 60%),
                var(--bg-light);
        }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
